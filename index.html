<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>esinmiedo</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0b1d2a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      overflow: hidden;
    }

    h1 {
      z-index: 2;
    }

    canvas {
      position: fixed;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    #sound-btn {
      position: fixed;
      bottom: 20px;
      left: 20px;
      z-index: 3;
      padding: 10px 14px;
      border-radius: 20px;
      border: none;
      background: rgba(0,0,0,0.6);
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <button id="sound-btn">Turn on sound</button>

  <iframe
    id="yt-audio"
    width="0"
    height="0"
    frameborder="0"
    allow="autoplay; encrypted-media">
  </iframe>

  <h1>❄️ Happy New Year Mucular! ❄️</h1>
  <canvas id="snow"></canvas>

  <script>
    const btn = document.getElementById("sound-btn");
    const iframe = document.getElementById("yt-audio");

    btn.addEventListener("click", () => {
      iframe.src =
        "https://www.youtube.com/embed/kW5qjNphfMA?autoplay=1&playsinline=1";
      btn.style.display = "none";
    });
  </script>

  <script>
    const canvas = document.getElementById('snow');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const flakes = Array.from({ length: 120 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 3 + 1,
      d: Math.random() + 1
    }));

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'white';
      ctx.beginPath();
      flakes.forEach(f => {
        ctx.moveTo(f.x, f.y);
        ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
      });
      ctx.fill();
      update();
    }

    function update() {
      flakes.forEach(f => {
        f.y += f.d;
        if (f.y > canvas.height) {
          f.y = 0;
          f.x = Math.random() * canvas.width;
        }
      });
    }

    setInterval(draw, 33);
  </script>

</body>
</html>
